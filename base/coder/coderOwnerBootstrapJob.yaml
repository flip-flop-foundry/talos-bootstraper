###############################################################################
# First-owner bootstrap for the Coder control plane
#
# PostSync Job that seeds the initial Coder owner automatically so no manual
# `coder server create-admin-user` step is needed. It runs AFTER the Coder
# Deployment is healthy, then:
#   1. waits for the in-cluster Coder API to answer,
#   2. skips if the first user already exists (GET /api/v2/users/first -> 200),
#   3. otherwise creates the owner via the unauthenticated bootstrap endpoint
#      POST /api/v2/users/first with a securely generated random password,
#   4. persists email/username/password into the `coder-owner-bootstrap` secret,
#   5. if gitea-bootstrap.sh staged an ephemeral `coder-gitea-ci` credential,
#      mints a Coder API token, publishes it as the CODER_SESSION_TOKEN repo
#      Actions secret in Gitea, then revokes the CI token and deletes the secret.
#
# Idempotent: reruns on every sync. Owner creation only acts when no owner exists;
# token publishing only acts while the ephemeral coder-gitea-ci secret is present
# (deleted after first success). If a password is already stored in the secret it
# is reused, so the stored value stays valid even if the user is recreated.
###############################################################################
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-owner-bootstrap
  namespace: ${CODER_NAMESPACE}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-owner-bootstrap
  namespace: ${CODER_NAMESPACE}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
rules:
  # Least-privilege: only ever read/patch the one secret this Job manages.
  # (create cannot be constrained by resourceNames, so it is a separate rule.)
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["coder-owner-bootstrap"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # The ephemeral CI credential staged by gitea-bootstrap.sh: read it to publish
  # CODER_SESSION_TOKEN, then delete it so no standing credential is left behind.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["coder-gitea-ci"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-owner-bootstrap
  namespace: ${CODER_NAMESPACE}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-owner-bootstrap
subjects:
  - kind: ServiceAccount
    name: coder-owner-bootstrap
    namespace: ${CODER_NAMESPACE}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: coder-owner-bootstrap
  namespace: ${CODER_NAMESPACE}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 3
  template:
    metadata:
      name: coder-owner-bootstrap
    spec:
      serviceAccountName: coder-owner-bootstrap
      automountServiceAccountToken: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: owner-bootstrap
          image: alpine/k8s:${KUBERNETES_VERSION}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              NS="${CODER_NAMESPACE}"
              SECRET="coder-owner-bootstrap"
              SVC="http://coder.${CODER_NAMESPACE}.svc"
              EMAIL="admin@${CODER_DOMAIN_NAME}"
              USERNAME="admin"

              # 1. Wait for the Coder API to answer (buildinfo is unauthenticated).
              echo "Waiting for Coder API at ${SVC} ..."
              i=0
              until curl -fsS -o /dev/null "${SVC}/api/v2/buildinfo"; do
                i=$((i + 1))
                if [ "${i}" -ge 60 ]; then
                  echo "ERROR: Coder API not reachable after ~5m." >&2
                  exit 1
                fi
                sleep 5
              done
              echo "Coder API is up."

              # 2. Detect whether the first owner already exists.
              first_code="$(curl -fsS -o /dev/null -w '%{http_code}' "${SVC}/api/v2/users/first" || true)"
              if [ "${first_code}" = "200" ]; then
                echo "First owner already exists (GET /users/first -> 200)."
                OWNER_EXISTS=yes
              else
                echo "No owner yet (GET /users/first -> ${first_code}). Creating one."
                OWNER_EXISTS=no
              fi

              if [ "${OWNER_EXISTS}" = "no" ]; then
                # 3. Reuse a stored password if present, else generate a secure one.
                PASSWORD="$(kubectl get secret "${SECRET}" -n "${NS}" \
                  -o jsonpath='{.data.password}' 2>/dev/null | base64 -d 2>/dev/null || true)"
                if [ -n "${PASSWORD}" ]; then
                  echo "Reusing password already stored in ${NS}/${SECRET}."
                else
                  # Over-read entropy so the length survives stripping +/= (matches CNPG sibling).
                  PASSWORD="$(head -c 48 /dev/urandom | base64 | tr -d '/+=' | head -c 32)"
                  echo "Generated a new random owner password."
                fi

                # 4. Create the first owner via the bootstrap endpoint.
                body="$(printf '{"email":"%s","username":"%s","password":"%s","trial":false}' \
                  "${EMAIL}" "${USERNAME}" "${PASSWORD}")"
                resp="$(curl -sS -X POST -H 'Content-Type: application/json' \
                  -d "${body}" -w '\n%{http_code}' "${SVC}/api/v2/users/first" 2>&1 || true)"
                code="$(printf '%s\n' "${resp}" | tail -n1)"
                payload="$(printf '%s\n' "${resp}" | sed '$d')"
                if [ "${code}" = "201" ]; then
                  echo "Created Coder owner ${USERNAME} <${EMAIL}>."
                elif printf '%s' "${payload}" | grep -qi 'already'; then
                  echo "Owner was created concurrently; reusing existing owner."
                else
                  echo "ERROR: failed to create first owner (HTTP ${code}):" >&2
                  printf '%s\n' "${payload}" >&2
                  exit 1
                fi

                # 5. Persist the credentials into the secret (patch the shell, or create).
                e_b64="$(printf '%s' "${EMAIL}" | base64 | tr -d '\n')"
                u_b64="$(printf '%s' "${USERNAME}" | base64 | tr -d '\n')"
                p_b64="$(printf '%s' "${PASSWORD}" | base64 | tr -d '\n')"
                if ! kubectl patch secret "${SECRET}" -n "${NS}" --type merge \
                  -p "{\"data\":{\"email\":\"${e_b64}\",\"username\":\"${u_b64}\",\"password\":\"${p_b64}\"}}" 2>/dev/null; then
                  kubectl create secret generic "${SECRET}" -n "${NS}" \
                    --type=Opaque \
                    --from-literal=email="${EMAIL}" \
                    --from-literal=username="${USERNAME}" \
                    --from-literal=password="${PASSWORD}"
                fi
                echo "Stored owner credentials in secret ${NS}/${SECRET} (username=${USERNAME}, email=${EMAIL})."
              fi

              # 6. Publish CODER_SESSION_TOKEN to Gitea, if gitea-bootstrap.sh staged
              #    an ephemeral CI credential. This Job is the only point where both
              #    Coder and Gitea are up, so the token is minted and pushed here.
              if ! kubectl get secret coder-gitea-ci -n "${NS}" >/dev/null 2>&1; then
                echo "No coder-gitea-ci secret; CODER_SESSION_TOKEN already published or CI not configured. Done."
                exit 0
              fi
              echo "Ephemeral CI credential present; publishing CODER_SESSION_TOKEN to Gitea."

              # 6a. Need the owner password to mint a Coder token.
              PASSWORD="$(kubectl get secret "${SECRET}" -n "${NS}" \
                -o jsonpath='{.data.password}' 2>/dev/null | base64 -d 2>/dev/null || true)"
              if [ -z "${PASSWORD}" ]; then
                echo "ERROR: owner password not stored in ${NS}/${SECRET}; cannot mint Coder token." >&2
                exit 1
              fi

              # 6b. Log in as the owner and mint a long-lived Coder API token.
              login_resp="$(curl -sS -X POST -H 'Content-Type: application/json' \
                -d "$(printf '{"email":"%s","password":"%s"}' "${EMAIL}" "${PASSWORD}")" \
                "${SVC}/api/v2/users/login" || true)"
              session_token="$(printf '%s' "${login_resp}" | jq -r '.session_token // empty')"
              if [ -z "${session_token}" ]; then
                echo "ERROR: Coder owner login failed." >&2
                exit 1
              fi
              key_resp="$(curl -sS -X POST -H "Coder-Session-Token: ${session_token}" \
                -H 'Content-Type: application/json' \
                -d '{"scope":"all","token_name":"gitea-ci-templates"}' \
                "${SVC}/api/v2/users/me/keys/tokens" || true)"
              coder_key="$(printf '%s' "${key_resp}" | jq -r '.key // empty')"
              if [ -z "${coder_key}" ]; then
                echo "ERROR: failed to mint Coder API token: ${key_resp}" >&2
                exit 1
              fi

              # 6c. Read the ephemeral Gitea CI credential.
              get_ci() { kubectl get secret coder-gitea-ci -n "${NS}" -o "jsonpath={.data.${1}}" 2>/dev/null | base64 -d 2>/dev/null; }
              GT_TOKEN="$(get_ci token)"; GT_TOKEN_ID="$(get_ci token-id)"
              GT_API="$(get_ci api-url)"; GT_ORG="$(get_ci org)"; GT_REPO="$(get_ci repo)"
              GT_USER="$(get_ci username)"; GT_PASS="$(get_ci password)"

              # 6d. Publish the Coder token as a repo Actions secret. Gitea uses the
              #     private cluster CA; -k trusts it in-cluster (as gitea-bootstrap.sh does).
              put_code="$(curl -k -sS -o /dev/null -w '%{http_code}' -X PUT \
                -H "Authorization: token ${GT_TOKEN}" -H 'Content-Type: application/json' \
                -d "$(jq -n --arg d "${coder_key}" '{data:$d}')" \
                "${GT_API}/repos/${GT_ORG}/${GT_REPO}/actions/secrets/CODER_SESSION_TOKEN")"
              case "${put_code}" in
                201|204) echo "Published CODER_SESSION_TOKEN to ${GT_ORG}/${GT_REPO}." ;;
                *) echo "ERROR: failed to publish CODER_SESSION_TOKEN (HTTP ${put_code})." >&2; exit 1 ;;
              esac

              # 6e. Revoke the now-unneeded Gitea CI token and delete the ephemeral
              #     secret so no standing credential remains in the coder namespace.
              #     If revocation fails the k8s secret is still deleted; the orphaned
              #     token is low-risk (ephemeral, scoped to write:repository on one
              #     repo) and is superseded on the next successful bootstrap.
              rev_code="$(curl -k -sS -o /dev/null -w '%{http_code}' -X DELETE \
                -u "${GT_USER}:${GT_PASS}" \
                "${GT_API}/users/${GT_USER}/tokens/${GT_TOKEN_ID}" || true)"
              if [ "${rev_code}" = "204" ]; then
                echo "Revoked the ephemeral Gitea CI token."
              else
                echo "WARN: could not revoke Gitea CI token (HTTP ${rev_code}); deleting secret anyway." >&2
              fi
              kubectl delete secret coder-gitea-ci -n "${NS}" --ignore-not-found
              echo "Removed ephemeral secret ${NS}/coder-gitea-ci. CODER_SESSION_TOKEN wiring complete."
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
