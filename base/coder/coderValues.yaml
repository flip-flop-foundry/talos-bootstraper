# Coder control-plane Helm values (chart: oci://ghcr.io/coder/chart/coder)
# Only non-default values are set. See `helm show values oci://ghcr.io/coder/chart/coder`
# for the full schema. Security hardening follows the workload standards in
# .github/copilot-instructions.md.
coder:
  image:
    repo: "ghcr.io/coder/coder"
    tag: "${CODER_IMAGE_TAG}"  # Pinned; chart default tracks chart appVersion
    pullPolicy: IfNotPresent

  # Restart the deployment automatically when the referenced Secrets change
  # (GitHub OAuth credentials, composed Postgres URL). Handled by Reloader.
  annotations:
    reloader.stakater.com/auto: "true"

  priorityClassName: "cluster-services"

  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  # Container-level hardening. runAsNonRoot/runAsUser default to 1000 in the chart.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

  # Least-privilege service account: no workspace permissions in the control-plane
  # namespace; scoped Role/RoleBinding are created only in the workspaces namespace.
  serviceAccount:
    workspacePerms: false
    enableDeployments: false
    workspaceNamespaces:
      - name: ${CODER_WORKSPACES_NAMESPACE}
        workspacePerms: true
        enableDeployments: false  # Workspaces are Pods + PVCs, not Deployments

  # Traefik ingress terminates TLS with a cert-manager-issued certificate.
  service:
    enable: true
    type: ClusterIP
  ingress:
    enable: true
    className: "traefik"
    host: ${CODER_DOMAIN_NAME}
    annotations:
      cert-manager.io/cluster-issuer: ${TALOS_CLUSTER_NAME}-ca-issuer
      cert-manager.io/common-name: ${CODER_DOMAIN_NAME}
      external-dns.alpha.kubernetes.io/hostname: "${CODER_DOMAIN_NAME}"
      advertise-via-dns: "true"
    tls:
      enable: true
      secretName: cert-${CODER_DOMAIN_NAME}  # Created by cert-manager

  # readOnlyRootFilesystem requires a writable cache/tmp dir.
  volumes:
    - name: tmp
      emptyDir: {}
    - name: psql-client-cert-vol
      secret:
        secretName: coder-cnpg-client-cert
        defaultMode: 384  # 0600
    - name: psql-ca-cert-vol
      configMap:
        name: cluster-ca-bundle
        defaultMode: 384
  volumeMounts:
    - name: tmp
      mountPath: /tmp
    - name: psql-client-cert-vol
      readOnly: true
      mountPath: /pg-client-crt
    - name: psql-ca-cert-vol
      readOnly: true
      mountPath: /pg-ca-crt

  env:
    - name: CODER_ACCESS_URL
      value: "https://${CODER_DOMAIN_NAME}"
    - name: CODER_CACHE_DIRECTORY
      value: /tmp/coder-cache
    # Postgres connection URL from the CNPG-generated `coder-sql-app` secret.
    # The `uri` key carries user/password/host/dbname but no TLS parameters; the
    # libpq PG* env vars below supply mTLS for the parameters absent from the URL
    # (same mechanism Gitea uses against its CNPG cluster).
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-sql-app
          key: uri
    - name: PGSSLMODE
      value: verify-full
    - name: PGSSLCERT
      value: /pg-client-crt/tls.crt
    - name: PGSSLKEY
      value: /pg-client-crt/tls.key
    - name: PGSSLROOTCERT
      value: /pg-ca-crt/ca.crt
    # GitHub OAuth — credentials are admin-populated in the coder-github-oauth secret.
    # Marked optional so Coder still starts (with GitHub OAuth disabled) before the
    # admin fills them; use the break-glass owner to bootstrap in that window.
    - name: CODER_OAUTH2_GITHUB_ALLOW_SIGNUPS
      value: "true"
    - name: CODER_OAUTH2_GITHUB_ALLOWED_ORGS
      value: "${CODER_OAUTH2_GITHUB_ALLOWED_ORGS}"
    - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
      value: "false"  # Use our own GitHub OAuth app, not Coder's built-in default provider
    - name: CODER_OAUTH2_GITHUB_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: coder-github-oauth
          key: client-id
          optional: true
    - name: CODER_OAUTH2_GITHUB_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: coder-github-oauth
          key: client-secret
          optional: true
